<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>simple day</title>
   <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
      rel="stylesheet" />
   <link rel="stylesheet" href="./styles/styles.css?v=20261027" />
   <script>
      (function () {
         var t = null;
         try { t = localStorage.getItem("simpleDay_theme"); } catch (e) { }
         document.documentElement.dataset.theme = t || "warm-cream";
      })();
   </script>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
   <script src="./js/supabase-config.js" defer></script>
   <script src="./js/cloud-auth.js" defer></script>
</head>

<body>
   <header class="app-header">
      <div class="header-inner">
         <div class="header-brand">
            <a href="./index.html" class="brand-link">
               <span class="brand-symbol">✦</span>
               <span class="brand-title">simple day</span>
            </a>
         </div>
         <nav class="header-nav">
            <ul>
               <li><a href="./index.html" class="active">Home</a></li>
               <li><a href="./pages/planner.html">Planner</a></li>
               <li><a href="./pages/calender.html">Calendar</a></li>
               <li><a href="./pages/projects.html">Projects</a></li>
               <li><a href="./pages/focus.html">Focus</a></li>
               <li><a href="./pages/habits.html">Habits</a></li>
            </ul>
         </nav>
         <div class="header-actions">
            <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
               <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path
                     d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z" />
                  <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)" />
                  <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)" />
                  <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)" />
               </svg>
               <span class="theme-toggle-label">Warm Cream</span>
            </button>
            <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
               <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
               <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
            </button>
         </div>
      </div>
   </header>

   <div id="greetings">
      <h1 id="greetingText"><span id="greetingPrefix">Good Morning</span> <span id="userName"
            class="greeting-name">Kaleb</span></h1>
      <p id="currentDateDisplay" class="date-subtitle"></p>
   </div>

   <main class="tasks-page-container">
      <!-- Top Google Tasks-style quick bar & stats -->
      <div class="tasks-top-bar">
         <div id="statsRow" class="stats-row">
            <div class="stats-indicator">
               <span id="statsCount">0 of 0 completed</span>
               <div class="stats-bar-track">
                  <div id="statsBarFill" class="stats-bar-fill"></div>
               </div>
            </div>
            <div class="top-bar-actions">
               <button type="button" id="clearCompletedBtn" class="btn-clear" title="Clear all completed tasks">Clear Completed</button>
               <button type="button" id="addSectionBtn" class="pill pill-action add-section-btn">+ Add Section</button>
            </div>
         </div>

         <!-- Google Tasks style quick task creation input bar -->
         <div class="google-tasks-input-card">
            <div class="task-input-icon" aria-hidden="true">
               <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
               </svg>
            </div>
            <input type="text" id="AddTasksInput" placeholder="Add a task..." autofocus />
            <div class="task-input-controls">
               <select id="taskSectionSelect" class="section-select-pill" title="Choose section" aria-label="Target section">
                  <!-- dynamically populated with sections -->
               </select>
               <button type="button" id="AddTaskBtn" class="pill">Add</button>
            </div>
         </div>
      </div>

      <!-- Container where custom user sections are rendered -->
      <div id="sectionsContainer" class="sections-container">
         <!-- Dynamically generated sections -->
      </div>
   </main>

   <!-- New Section Modal -->
   <dialog id="newSectionModal" class="app-modal">
      <form method="dialog" id="newSectionForm">
         <h3>New Section</h3>
         <div class="form-group">
            <label for="newSectionNameInput">Section Name</label>
            <input type="text" id="newSectionNameInput" placeholder="e.g. Work, Personal, Groceries..." required />
         </div>
         <div class="modal-actions">
            <button type="button" id="cancelSectionBtn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Create Section</button>
         </div>
      </form>
   </dialog>

   <!-- Rename Section Modal -->
   <dialog id="renameSectionModal" class="app-modal">
      <form method="dialog" id="renameSectionForm">
         <h3>Rename Section</h3>
         <div class="form-group">
            <label for="renameSectionNameInput">Section Name</label>
            <input type="text" id="renameSectionNameInput" required />
         </div>
         <div class="modal-actions">
            <button type="button" id="cancelRenameSectionBtn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
         </div>
      </form>
   </dialog>

   <script src="./js/db.js" defer></script>
   <script src="./js/theme-profile.js?v=20261009" defer></script>
   <script src="script.js" defer></script>
</body>

</html>
