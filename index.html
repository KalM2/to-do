<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>simple day</title>
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
      rel="stylesheet" />
   <link rel="stylesheet" href="./styles/styles.css?v=20261009" />
   <script>
      (function () {
         var t = null;
         try { t = localStorage.getItem("simpleDay_theme"); } catch (e) { }
         document.documentElement.dataset.theme = t || "warm-cream";
      })();
   </script>
</head>

<body>
   <header class="app-header">
      <div class="header-inner">
         <div class="header-brand">
            <a href="./index.html" class="brand-link">
               <span class="brand-symbol">✦</span>
               <span class="brand-title">simple day</span>
            </a>
         </div>
         <nav class="header-nav">
            <ul>
               <li><a href="./index.html" class="active">Home</a></li>
               <li><a href="./pages/planner.html">Planner</a></li>
               <li><a href="./pages/calender.html">Calender</a></li>
               <li><a href="./pages/projects.html">Projects</a></li>
               <li><a href="./pages/focus.html">Focus</a></li>
               <li><a href="./pages/habits.html">Habits</a></li>
            </ul>
         </nav>
         <div class="header-actions">
            <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
               <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path
                     d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z" />
                  <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)" />
                  <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)" />
                  <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)" />
               </svg>
               <span class="theme-toggle-label">Warm Cream</span>
            </button>
            <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
               <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
               <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
            </button>
         </div>
      </div>
   </header>

   <div id="greetings">
      <h1 id="greetingText"><span id="greetingPrefix">Good Morning</span> <span id="userName"
            class="greeting-name">Kaleb</span></h1>
      <p id="currentDateDisplay" class="date-subtitle"></p>
   </div>

   <div class="dashboard-controls">
      <div id="TimeFormatChoice">
         <button type="button" id="btnTime" class="btn-toggle">time of day format</button>
         <button type"button" id="btnPriority" class="btn-toggle active">priority format</button>
      </div>
      <div id="statsRow" class="stats-row">
         <div class="stats-indicator">
            <span id="statsCount">0 of 0 completed</span>
            <div class="stats-bar-track">
               <div id="statsBarFill" class="stats-bar-fill"></div>
            </div>
         </div>
         <button type="button" id="clearCompletedBtn" class="btn-clear" title="Clear all completed tasks">Clear
            Completed</button>
      </div>
   </div>

   <main>
      <div id="formatContainer">
         <!-- ? TIME VIEW -->
         <div id="timeGroup" class="hidden">
            <div class="section-wrapper">
               <h2>Morning</h2>
               <div id="morning-list" class="task-list"></div>
            </div>
            <div class="section-wrapper">
               <h2>Afternoon</h2>
               <div id="afternoon-list" class="task-list"></div>
            </div>
            <div class="section-wrapper">
               <h2>Evening</h2>
               <div id="evening-list" class="task-list"></div>
            </div>
         </div>

         <!-- ? PRIORITY VIEW -->
         <div id="priorityGroup">
            <div class="section-wrapper">
               <h2>Urgent & Important</h2>
               <div id="urgent-important-list" class="task-list"></div>
            </div>
            <div class="section-wrapper">
               <h2>Important</h2>
               <div id="important-list" class="task-list"></div>
            </div>
            <div class="section-wrapper">
               <h2>Urgent</h2>
               <div id="urgent-list" class="task-list"></div>
            </div>
         </div>

         <!-- ! REMAINING TASKS -->
         <div class="section-wrapper" id="remainingWrapper">
            <h2>Remaining Tasks</h2>
            <div id="remainingTaskList" class="task-list"></div>
         </div>
      </div>

      <div class="vertical-divider"></div>

      <div id="NewTask">
         <label for="AddTasksInput">Add a new task</label>
         <input type="text" id="AddTasksInput" placeholder="Type and hit Enter..." autofocus />

         <p class="pill-label">Time Format</p>
         <div class="pill-container" id="timePills">
            <button type="button" class="pill" data-value="morning-list">Morning</button>
            <button type="button" class="pill" data-value="afternoon-list">Afternoon</button>
            <button type="button" class="pill" data-value="evening-list">Evening</button>
            <button type="button" class="pill" data-value="advanced">Advanced</button>
         </div>

         <p class="pill-label">Priority</p>
         <div class="pill-container" id="priorityPills">
            <button type="button" class="pill" data-value="urgent-important-list">Urgent/Imp</button>
            <button type="button" class="pill" data-value="important-list">Important</button>
            <button type="button" class="pill" data-value="urgent-list">Urgent</button>
         </div>

         <button type="button" id="AddTaskBtn">add task</button>
      </div>
   </main>

   <script src="./js/db.js"></script>
   <script src="./js/theme-profile.js?v=20261009"></script>
   <script src="script.js"></script>
</body>

</html>
