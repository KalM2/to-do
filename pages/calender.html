<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar - simple day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/styles.css" />
  <script>
    (function() {
      var t = null;
      try { t = localStorage.getItem("simpleDay_theme"); } catch(e) {}
      document.documentElement.dataset.theme = t || "warm-cream";
    })();
  </script>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="../index.html" class="brand-link">
          <span class="brand-symbol">✦</span>
          <span class="brand-title">simple day</span>
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./planner.html">Planner</a></li>
          <li><a href="./calender.html" class="active">Calender</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./habits.html">Habits</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
          <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z"/>
            <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)"/>
            <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)"/>
            <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)"/>
          </svg>
          <span class="theme-toggle-label">Warm Cream</span>
        </button>
        <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
          <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
          <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
        </button>
      </div>
    </div>
  </header>

  <div id="greetings">
    <h1>Monthly Calendar</h1>
    <div class="calendar-month-nav">
      <button type="button" id="prevMonthBtn" class="nav-arrow-btn" title="Previous Month">‹</button>
      <span id="currentMonthYear" class="month-nav-title"></span>
      <button type="button" id="nextMonthBtn" class="nav-arrow-btn" title="Next Month">›</button>
      <button type="button" id="todayMonthBtn" class="pill">Today</button>
    </div>
  </div>

  <main class="calendar-layout">
    <!-- Monthly Grid Container -->
    <div class="calendar-grid-card">
      <div class="calendar-weekdays-header">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>
      <div class="calendar-days-grid" id="calendarDaysGrid">
        <!-- Rendered via JS -->
      </div>
    </div>

    <div class="vertical-divider"></div>

    <!-- Day Inspector & Events Sidebar -->
    <aside class="calendar-sidebar">
      <div class="planner-card day-agenda-widget">
        <h3 id="selectedDateTitle" class="agenda-date-title">Events</h3>
        
        <!-- Add Event Form -->
        <form id="addEventForm" class="add-event-form">
          <input type="text" id="eventTitleInput" placeholder="Event title..." required />
          <div class="event-time-row">
            <input type="time" id="eventTimeInput" value="09:00" />
            <div class="pill-container" id="eventCategoryPills">
              <button type="button" class="pill selected" data-cat="Work">Work</button>
              <button type="button" class="pill" data-cat="Personal">Personal</button>
              <button type="button" class="pill" data-cat="Urgent">Urgent</button>
              <button type="button" class="pill" data-cat="Wellness">Wellness</button>
            </div>
          </div>
          <button type="submit" id="addEventBtn" class="pill pill-action">+ Add Event</button>
        </form>

        <!-- Events List for Selected Day -->
        <div class="day-events-list" id="dayEventsList">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- Upcoming Events Agenda -->
      <div class="planner-card upcoming-widget">
        <p class="pill-label">Upcoming This Month</p>
        <div class="upcoming-events-list" id="upcomingEventsList">
          <!-- Rendered via JS -->
        </div>
      </div>
    </aside>
  </main>

  <script src="../js/theme-profile.js"></script>
  <script src="../js/calendar.js"></script>
</body>

</html>
