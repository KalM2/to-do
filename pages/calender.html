<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar - simple day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/styles.css" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("simpleDay_theme"); } catch (e) { }
      document.documentElement.dataset.theme = t || "warm-cream";
    })();
  </script>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="../index.html" class="brand-link">
          <span class="brand-symbol">✦</span>
          <span class="brand-title">simple day</span>
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./planner.html">Planner</a></li>
          <li><a href="./calender.html" class="active">Calender</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./focus.html">Focus</a></li>
          <li><a href="./habits.html">Habits</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
          <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path
              d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z" />
            <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)" />
            <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)" />
            <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)" />
          </svg>
          <span class="theme-toggle-label">Warm Cream</span>
        </button>
        <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
          <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
          <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
        </button>
      </div>
    </div>
  </header>

  <div id="greetings">
    <h1>Calendar</h1>
    <div class="calendar-toolbar">
      <div class="calendar-month-nav">
        <button type="button" id="prevRangeBtn" class="nav-arrow-btn" title="Previous">‹</button>
        <span id="currentMonthYear" class="month-nav-title"></span>
        <button type="button" id="nextRangeBtn" class="nav-arrow-btn" title="Next">›</button>
        <button type="button" id="todayMonthBtn" class="pill">Today</button>
      </div>
      <div class="view-toggle-group" id="calendarViewToggle">
        <button type="button" class="btn-toggle" data-view="month">Month</button>
        <button type="button" class="btn-toggle active" data-view="week">Week</button>
        <button type="button" class="btn-toggle" data-view="day">Day</button>
      </div>
      <div class="calendar-sync-actions">
        <label class="pill pill-action btn-file-label">
          Import ICS
          <input type="file" id="icsImportInput" accept=".ics,text/calendar" hidden />
        </label>
        <button type="button" id="googleSyncBtn" class="pill">Connect Google Calendar</button>
      </div>
    </div>
    <p id="calendarSyncStatus" class="date-subtitle"></p>
  </div>

  <main class="calendar-layout google-cal-layout">
    <div class="calendar-main-pane">
      <div id="monthView" class="calendar-grid-card hidden">
        <div class="calendar-weekdays-header">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>
        <div class="calendar-days-grid" id="calendarDaysGrid"></div>
      </div>

      <div id="weekView" class="calendar-grid-card timed-cal-card">
        <div class="gcal-scroll" id="weekScroll">
          <div class="gcal-week-header" id="weekHeader"></div>
          <div class="gcal-timed-grid" id="weekGrid"></div>
        </div>
      </div>

      <div id="dayView" class="calendar-grid-card timed-cal-card hidden">
        <div class="gcal-scroll" id="dayScroll">
          <div class="gcal-timed-grid gcal-day-grid" id="dayGrid"></div>
        </div>
      </div>

      <section class="planner-card google-calendars-widget">
        <h2 class="agenda-date-title">My Calendars</h2>
        <p id="googleCalendarsMessage" class="calendar-list-message"></p>
        <div id="googleCalendarsList" class="google-calendar-list" aria-label="Google calendars"></div>
      </section>
    </div>

    <aside class="calendar-sidebar">
      <div class="planner-card day-agenda-widget">
        <h3 id="selectedDateTitle" class="agenda-date-title">Events for today</h3>
        <div class="day-events-list" id="dayEventsList"></div>
      </div>

      <div class="planner-card upcoming-widget">
        <p class="pill-label">Upcoming</p>
        <div class="upcoming-events-list" id="upcomingEventsList"></div>
      </div>
    </aside>
  </main>

  <button type="button" id="openAddEventBtn" class="floating-add-event" aria-label="Add new event"
    title="Add new event">
    <span aria-hidden="true">+</span>
  </button>

  <dialog id="addEventModal" class="app-modal add-event-modal">
    <form method="dialog" id="addEventForm">
      <h3>Add new event</h3>
      <div class="form-group">
        <label for="eventTitleInput">Event title</label>
        <input type="text" id="eventTitleInput" placeholder="Event title..." required />
      </div>
      <div class="form-group event-time-row">
        <label class="inline-time-label">Start <input type="time" id="eventTimeInput" value="09:00" /></label>
        <label class="inline-time-label">End <input type="time" id="eventEndTimeInput" value="10:00" /></label>
      </div>
      <div class="modal-actions">
        <button type="button" id="closeAddEventBtn" class="btn-secondary">Cancel</button>
        <button type="submit" id="addEventBtn" class="btn-primary">Add event</button>
      </div>
    </form>
  </dialog>

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="../js/db.js"></script>
  <script src="../js/theme-profile.js"></script>
  <script src="../js/calendar.js"></script>
</body>

</html>
