<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar - simple day</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/styles.css?v=20261027" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("simpleDay_theme"); } catch (e) { }
      document.documentElement.dataset.theme = t || "warm-cream";
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase-config.js" defer></script>
  <script src="../js/cloud-auth.js" defer></script>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="../index.html" class="brand-link">
          <span class="brand-symbol">✦</span>
          <span class="brand-title">simple day</span>
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./planner.html">Planner</a></li>
          <li><a href="./calender.html" class="active">Calender</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./focus.html">Focus</a></li>
          <li><a href="./habits.html">Habits</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
          <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path
              d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z" />
            <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)" />
            <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)" />
            <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)" />
          </svg>
          <span class="theme-toggle-label">Warm Cream</span>
        </button>
        <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
          <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
          <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Greetings header to match other tabs -->
  <div id="greetings">
    <h1>Calendar</h1>
    <p class="date-subtitle" id="calCurrentDateSubtitle"></p>
  </div>

  <!-- Hidden marker kept for theme-profile.js isCalendarPage detection -->
  <div id="calendarViewToggle" hidden aria-hidden="true"></div>
  <input type="file" id="icsImportInput" accept=".ics" hidden aria-hidden="true" />
  <span id="calendarSyncStatus" hidden aria-hidden="true"></span>

  <main class="cal-modern-container">
    <!-- Minimalist modern control bar -->
    <div class="cal-control-bar">
      <div class="cal-control-info">
        <span class="cal-overview-badge">✦ Agenda</span>
        <span class="cal-overview-count" id="totalEventsCount">0 events</span>
      </div>
      <div class="cal-control-actions">
        <button type="button" id="openSettingsBtn" class="pill cal-control-pill" title="Manage Calendar sources and sync">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          Manage Calendars
        </button>
      </div>
    </div>

    <!-- Event feed container (Today, Upcoming, Past) -->
    <div class="cal-event-feed" id="calEventFeed"></div>
  </main>

  <!-- Calendar Sources & Sync Modal -->
  <dialog id="calendarSettingsModal" class="app-modal calendar-settings-modal">
    <div class="cal-modal-header">
      <div>
        <h3>Manage Calendars</h3>
        <p class="cal-modal-subtitle">Connect external calendars or import .ics files</p>
      </div>
      <button type="button" id="closeSettingsIcon" class="theme-picker-close" aria-label="Close dialog">✕</button>
    </div>

    <div class="cal-modal-body">
      <div class="cal-sync-options">
        <button type="button" id="googleSyncBtn" class="cal-source-card">
          <div class="cal-source-icon google-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M21.35 11.1H12v2.8h5.37C16.8 16.35 14.58 18 12 18a6 6 0 110-12c1.7 0 3.23.72 4.34 1.87l2.12-2.12A9.93 9.93 0 0012 3C6.48 3 2 7.48 2 13s4.48 10 10 10c5.52 0 10-4.48 10-10 0-.68-.07-1.33-.2-1.9h-.45z"/>
            </svg>
          </div>
          <div class="cal-source-info">
            <span class="cal-source-title">Google Calendar</span>
            <span class="cal-source-desc">Sync your Google account events directly</span>
          </div>
          <span class="pill cal-source-btn">Connect</span>
        </button>

        <button type="button" id="importIcsBtn" class="cal-source-card">
          <div class="cal-source-icon ics-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 011 1v4h4a1 1 0 010 2h-4v4a1 1 0 01-2 0v-4H7a1 1 0 010-2h4V7a1 1 0 011-1z"/>
            </svg>
          </div>
          <div class="cal-source-info">
            <span class="cal-source-title">Import iCalendar (.ics)</span>
            <span class="cal-source-desc">Upload exported calendar files</span>
          </div>
          <span class="pill cal-source-btn">Upload</span>
        </button>
      </div>

      <div class="cal-connected-section" id="calCalendarsBar" hidden>
        <span class="cal-section-subtitle">Connected Calendars</span>
        <div class="cal-calendar-chips" id="googleCalendarsList"></div>
        <p id="googleCalendarsMessage" class="cal-calendars-msg" hidden></p>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="closeSettingsBtn" class="btn-primary">Done</button>
    </div>
  </dialog>

  <!-- Modern Floating Toast Notification -->
  <div id="calSyncFeedback" class="cal-toast" role="status" aria-live="polite"></div>

  <!-- Event preview dialog -->
  <dialog id="eventPreviewModal" class="app-modal event-preview-modal">
    <div class="event-preview-header">
      <div>
        <h3 id="eventPreviewTitle"></h3>
        <p id="eventPreviewDateTime"></p>
      </div>
      <button type="button" id="closeEventPreviewIcon" class="theme-picker-close"
        aria-label="Close event details">✕</button>
    </div>
    <p id="eventPreviewCalendar" class="event-preview-calendar"></p>
    <div class="modal-actions">
      <button type="button" id="closeEventPreviewBtn" class="btn-secondary">Close</button>
    </div>
  </dialog>

  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="../js/db.js" defer></script>
  <script src="../js/theme-profile.js?v=20261009" defer></script>
  <script src="../js/calendar.js?v=20261012" defer></script>
</body>

</html>
