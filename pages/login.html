<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - simple day</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../styles/styles.css?v=20261011" />
    <link rel="stylesheet" href="../styles/auth.css?v=20261011" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/cloud-auth.js"></script>
    <script src="../js/auth-page.js?v=20261011" defer></script>
</head>

<body class="auth-page">
    <main class="auth-shell">
        <a href="../index.html" class="brand-link auth-brand"><span class="brand-symbol">✦</span><span
                class="brand-title">simple day</span></a>
        <section class="auth-panel" aria-labelledby="authTitle">
            <p class="auth-kicker">Your day, in order</p>
            <h1 id="authTitle">Welcome back</h1>
            <div class="auth-mode-switch" role="group" aria-label="Account action">
                <button type="button" class="auth-mode active" data-mode="login" aria-pressed="true">Log in</button>
                <button type="button" class="auth-mode" data-mode="signup" aria-pressed="false">Create account</button>
            </div>
            <form id="authForm" class="auth-form">
                <label class="form-group" for="authEmailInput">Email
                    <input type="email" id="authEmailInput" autocomplete="email" required />
                </label>
                <label class="form-group" for="authPasswordInput">Password
                    <input type="password" id="authPasswordInput" autocomplete="current-password" minlength="8"
                        required />
                </label>
                <label class="form-group" for="confirmPasswordInput" id="confirmPasswordField" hidden>Confirm password
                    <input type="password" id="confirmPasswordInput" autocomplete="new-password" minlength="8" />
                </label>
                <button type="submit" id="authSubmitBtn" class="btn-primary">Log in</button>
            </form>
            <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>

</html>
