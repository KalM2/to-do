<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - simple day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/styles.css" />
  <script>
    (function() {
      var t = null;
      try { t = localStorage.getItem("simpleDay_theme"); } catch(e) {}
      document.documentElement.dataset.theme = t || "warm-cream";
    })();
  </script>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="../index.html" class="brand-link">
          <span class="brand-symbol">✦</span>
          <span class="brand-title">simple day</span>
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./planner.html">Planner</a></li>
          <li><a href="./calender.html">Calender</a></li>
          <li><a href="./projects.html" class="active">Projects</a></li>
          <li><a href="./habits.html">Habits</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
          <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z"/>
            <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)"/>
            <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)"/>
            <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)"/>
          </svg>
          <span class="theme-toggle-label">Warm Cream</span>
        </button>
        <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
          <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
          <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
        </button>
      </div>
    </div>
  </header>

  <div id="greetings">
    <h1>Projects & Workspaces</h1>
    <p class="date-subtitle">Manage high-level project goals and daily execution pipelines</p>
  </div>

  <div class="projects-control-bar">
    <div class="view-toggle-group">
      <button type="button" id="btnProjectsView" class="btn-toggle active">Project Portfolios</button>
      <button type="button" id="btnKanbanView" class="btn-toggle">Kanban Board</button>
    </div>
    <button type="button" id="openNewProjectModalBtn" class="pill pill-action">+ New Project</button>
  </div>

  <main class="projects-container">
    <!-- View 1: Project Portfolio Cards -->
    <section id="projectCardsView" class="projects-grid-view">
      <div class="project-cards-grid" id="projectCardsGrid">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- View 2: Kanban Board -->
    <section id="kanbanBoardView" class="kanban-view hidden">
      <div class="kanban-board" id="kanbanBoard">
        <!-- Column 1: Backlog / To Do -->
        <div class="kanban-column" data-status="todo" id="col-todo">
          <div class="kanban-column-header">
            <h3>To Do</h3>
            <span class="count-badge" id="count-todo">0</span>
          </div>
          <div class="kanban-cards-list" data-column="todo"></div>
          <button type="button" class="btn-add-card" data-column="todo">+ Add task</button>
        </div>

        <!-- Column 2: In Progress -->
        <div class="kanban-column" data-status="in-progress" id="col-in-progress">
          <div class="kanban-column-header">
            <h3>In Progress</h3>
            <span class="count-badge" id="count-in-progress">0</span>
          </div>
          <div class="kanban-cards-list" data-column="in-progress"></div>
          <button type="button" class="btn-add-card" data-column="in-progress">+ Add task</button>
        </div>

        <!-- Column 3: In Review -->
        <div class="kanban-column" data-status="review" id="col-review">
          <div class="kanban-column-header">
            <h3>Review</h3>
            <span class="count-badge" id="count-review">0</span>
          </div>
          <div class="kanban-cards-list" data-column="review"></div>
          <button type="button" class="btn-add-card" data-column="review">+ Add task</button>
        </div>

        <!-- Column 4: Done -->
        <div class="kanban-column" data-status="done" id="col-done">
          <div class="kanban-column-header">
            <h3>Completed</h3>
            <span class="count-badge" id="count-done">0</span>
          </div>
          <div class="kanban-cards-list" data-column="done"></div>
          <button type="button" class="btn-add-card" data-column="done">+ Add task</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Create New Project Modal -->
  <dialog id="newProjectModal" class="app-modal">
    <form method="dialog" id="newProjectForm">
      <h3>Create New Project</h3>
      <div class="form-group">
        <label for="projectTitleInput">Project Title</label>
        <input type="text" id="projectTitleInput" placeholder="e.g. Website Redesign" required />
      </div>
      <div class="form-group">
        <label for="projectDescInput">Description / Objective</label>
        <textarea id="projectDescInput" class="planner-textarea" placeholder="Brief summary of goals..."></textarea>
      </div>
      <div class="form-group">
        <label for="projectDueDateInput">Target Due Date</label>
        <input type="date" id="projectDueDateInput" />
      </div>
      <div class="form-group">
        <label>Theme Color</label>
        <div class="pill-container" id="projectColorPills">
          <button type="button" class="pill selected" data-color="navy">Navy</button>
          <button type="button" class="pill" data-color="orange">Orange</button>
          <button type="button" class="pill" data-color="blue">Blue</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="closeProjectModalBtn" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Create Project</button>
      </div>
    </form>
  </dialog>

  <!-- Add Kanban Task Modal -->
  <dialog id="kanbanTaskModal" class="app-modal">
    <form method="dialog" id="kanbanTaskForm">
      <h3>Add Kanban Card</h3>
      <div class="form-group">
        <label for="cardTitleInput">Task Title</label>
        <input type="text" id="cardTitleInput" placeholder="What needs to be done?" required />
      </div>
      <div class="form-group">
        <label for="cardProjectSelect">Associated Project</label>
        <select id="cardProjectSelect" class="app-select">
          <option value="General">General</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <div class="pill-container" id="cardPriorityPills">
          <button type="button" class="pill" data-prio="Low">Low</button>
          <button type="button" class="pill selected" data-prio="Medium">Medium</button>
          <button type="button" class="pill" data-prio="High">High</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="closeCardModalBtn" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Add Card</button>
      </div>
    </form>
  </dialog>

  <script src="../js/theme-profile.js"></script>
  <script src="../js/projects.js"></script>
</body>

</html>
