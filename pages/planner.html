<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner - simple day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Tangerine:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/styles.css" />
  <script>
    (function() {
      var t = null;
      try { t = localStorage.getItem("simpleDay_theme"); } catch(e) {}
      document.documentElement.dataset.theme = t || "warm-cream";
    })();
  </script>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="../index.html" class="brand-link">
          <span class="brand-symbol">✦</span>
          <span class="brand-title">simple day</span>
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./planner.html" class="active">Planner</a></li>
          <li><a href="./calender.html">Calender</a></li>
          <li><a href="./projects.html">Projects</a></li>
          <li><a href="./focus.html">Focus</a></li>
          <li><a href="./habits.html">Habits</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="header-btn theme-toggle" aria-label="Choose color theme">
          <svg class="palette-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7Z"/>
            <circle cx="7.5" cy="11" r="1.3" fill="var(--bg)"/>
            <circle cx="10.5" cy="7" r="1.3" fill="var(--bg)"/>
            <circle cx="15" cy="7.5" r="1.3" fill="var(--bg)"/>
          </svg>
          <span class="theme-toggle-label">Warm Cream</span>
        </button>
        <button type="button" class="header-btn profile-toggle" aria-label="Account profile">
          <span class="profile-avatar-badge" id="headerProfileAvatar">K</span>
          <span class="profile-toggle-name" id="headerProfileName">Kaleb</span>
        </button>
      </div>
    </div>
  </header>

  <div id="greetings">
    <h1>Daily Planner</h1>
    <div class="planner-date-nav">
      <button type="button" id="prevDayBtn" class="nav-arrow-btn" title="Previous Day">‹</button>
      <span id="currentPlannerDate" class="planner-date-title"></span>
      <button type="button" id="nextDayBtn" class="nav-arrow-btn" title="Next Day">›</button>
      <button type="button" id="todayPlannerBtn" class="pill">Today</button>
    </div>
  </div>

  <main class="planner-layout">
    <div class="planner-main-content">
      <section class="section-wrapper planner-card">
        <h2>Top 3 Priorities</h2>
        <div class="priorities-list" id="prioritiesList"></div>
      </section>

      <section class="section-wrapper planner-card">
        <div class="section-heading-row">
          <h2>Daily schedule</h2>
          <a class="pill" href="./focus.html">Open Focus timer</a>
        </div>
        <div class="gcal-date-header">
          <div class="gcal-corner"></div>
          <div class="gcal-date-head-cell" id="plannerDateHeader"></div>
        </div>
        <div class="gcal-scroll planner-day-scroll" id="scheduleContainer"></div>
      </section>
    </div>

    <div class="vertical-divider"></div>

    <aside class="planner-sidebar">
      <div class="planner-card wellness-widget">
        <p class="pill-label">Daily Hydration</p>
        <div class="water-tracker" id="waterTracker"></div>
        <p class="water-caption"><span id="waterCount">0</span> of 8 glasses logged</p>
      </div>

      <div class="planner-card notes-widget journal-widget">
        <div class="section-heading-row">
          <p class="pill-label">Daily Notes &amp; Reflection</p>
          <button type="button" id="expandJournalBtn" class="pill">Expand</button>
        </div>
        <div class="journal-toolbar" id="journalToolbar">
          <button type="button" data-cmd="formatBlock" data-value="H1" title="Heading 1">H1</button>
          <button type="button" data-cmd="formatBlock" data-value="H2" title="Heading 2">H2</button>
          <button type="button" data-cmd="formatBlock" data-value="H3" title="Heading 3">H3</button>
          <button type="button" data-cmd="bold" title="Bold"><strong>B</strong></button>
          <button type="button" data-cmd="italic" title="Italic"><em>I</em></button>
          <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
          <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
          <button type="button" data-cmd="formatBlock" data-value="BLOCKQUOTE" title="Quote">Quote</button>
        </div>
        <div id="dailyNotes" class="journal-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write today's journal... # headings, bullets, and numbered lists all work."></div>
        <span class="notes-status" id="notesSaveStatus">Saved locally</span>
      </div>
    </aside>
  </main>

  <dialog id="slotModal" class="app-modal">
    <form method="dialog" id="slotForm">
      <h3 id="modalSlotTime">Schedule Event</h3>
      <div class="form-group">
        <label for="slotTextInput">Event or Focus Block</label>
        <input type="text" id="slotTextInput" placeholder="e.g. Deep Work, Team Sync, Lunch" required />
      </div>
      <div class="form-group event-time-row">
        <label class="inline-time-label">Start <input type="time" id="slotStartInput" /></label>
        <label class="inline-time-label">End <input type="time" id="slotEndInput" /></label>
      </div>
      <div class="form-group">
        <label>Category Tag</label>
        <div class="pill-container" id="slotTags">
          <button type="button" class="pill selected" data-tag="Focus">Focus</button>
          <button type="button" class="pill" data-tag="Meeting">Meeting</button>
          <button type="button" class="pill" data-tag="Routine">Routine</button>
          <button type="button" class="pill" data-tag="Personal">Personal</button>
          <button type="button" class="pill" data-tag="Break">Break</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="modalClearBtn" class="btn-secondary">Clear</button>
        <button type="button" id="modalCancelBtn" class="btn-secondary">Cancel</button>
        <button type="submit" id="modalSaveBtn" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="taskPickerModal" class="app-modal">
    <form method="dialog">
      <h3>Choose a project task</h3>
      <div id="taskPickerList" class="task-picker-list"></div>
      <div class="modal-actions">
        <button type="button" id="closeTaskPickerBtn" class="btn-secondary">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="journalModal" class="app-modal journal-modal">
    <div class="journal-modal-head">
      <h3>Daily journal</h3>
      <button type="button" id="closeJournalModalBtn" class="theme-picker-close" aria-label="Close journal">✕</button>
    </div>
    <div class="journal-toolbar" id="journalToolbarModal"></div>
    <div id="dailyNotesModal" class="journal-editor journal-editor-large" contenteditable="true"></div>
    <span class="notes-status" id="notesSaveStatusModal">Saved locally</span>
  </dialog>

  <script src="../js/theme-profile.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/planner.js"></script>
</body>

</html>
